<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BYOD Listener</title>
  <script>
    (function loadLiveKitClient() {
      const localSrc = './vendor/livekit-client.umd.1.15.13.js';
      const cdnSrc = 'https://unpkg.com/livekit-client@1.15.13/dist/livekit-client.umd.js';

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.async = false;
          script.onload = () => resolve(src);
          script.onerror = () => reject(new Error(`LiveKit script failed: ${src}`));
          document.head.appendChild(script);
        });
      }

      window.__livekitLoadPromise = loadScript(localSrc)
        .then((src) => {
          window.__livekitSdkSource = src;
          console.log(`[listener] LiveKit SDK loaded from local file: ${src}`);
        })
        .catch(() => loadScript(cdnSrc).then((src) => {
          window.__livekitSdkSource = src;
          console.log(`[listener] LiveKit SDK fallback loaded from CDN: ${src}`);
        }));
    }());
  </script>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 0 auto; padding: 16px; }
    #connectionBox { background: #f5f5f5; color: #111; padding: 10px; border-radius: 8px; display:none; margin-bottom:12px; border:1px solid #ddd; }
    #statusBox { background: #c62828; color: white; padding: 12px; border-radius: 8px; display:none; margin-bottom:12px; }
    .btn { display:block; width:100%; padding:16px; margin:10px 0; font-size:18px; border:0; border-radius:10px; background:#ececec; }
    .btn.active { background:#1976d2; color:white; }
    #log { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <div id="connectionBox"></div>
  <div id="statusBox"></div>
  <h1 id="roomName">Loading...</h1>
  <div id="buttons"></div>
  <audio id="player" autoplay playsinline></audio>
  <pre id="log"></pre>

  <script src="./listener.js"></script>
</body>
</html>
