server {
    listen 80 default_server;
    server_name _;

    root /opt/byod/listener;
    index index.html;

    location = / { try_files /index.html =404; add_header Cache-Control "no-store"; }
    location = /listener.js { try_files /listener.js =404; }
    location ^~ /vendor/ { try_files $uri =404; }
    location / { return 404; }

    location = /ws/listener {
        proxy_pass http://127.0.0.1:8000/ws/listener;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ws/publisher {
        proxy_pass http://127.0.0.1:8000/ws/publisher;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin/ { return 404; }

}
